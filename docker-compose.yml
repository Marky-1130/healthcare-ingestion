version: '3.9'

services:
  api:
    build: .
    container_name: healthcare-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started

  db:
    image: postgres:17
    container_name: healthcare-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack:
    image: localstack/localstack:3.8.1
    container_name: healthcare-localstack
    environment:
      - SERVICES=s3
      - DEBUG=1
      - ACTIVATE_PRO=0
    ports:
      - "4566:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  redis:
    image: redis:8
    container_name: healthcare-redis
    ports:
      - "6379:6379"

  celery-worker:
    build: .
    container_name: healthcare-celery
    working_dir: /app
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A worker.celery_app.celery worker -Q ingestion --loglevel=info
    restart: always