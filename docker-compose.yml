version: '3.9'

services:
  api:
    build: .
    container_name: healthcare-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started

  db:
    image: postgres:17
    container_name: healthcare-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - healthcare-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  localstack:
    image: localstack/localstack:3.8.1
    container_name: healthcare-localstack
    environment:
      - SERVICES=s3
      - DEBUG=1
      - ACTIVATE_PRO=0
    ports:
      - "4566:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  temporal:
    image: temporalio/auto-setup:1.27
    container_name: healthcare-temporal
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_DB=temporal
      - POSTGRES_SEEDS=db

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: healthcare-temporal-ui
    ports:
    - "8088:8080"
    environment:
    - TEMPORAL_ADDRESS=temporal:7233

  worker:
    build: .
    working_dir: /app
    container_name: healthcare-temporal-worker
    environment:
    - PYTHONPATH=/app
    - TEMPORAL_ADDRESS=temporal:7233
    env_file:
      - .env
    depends_on:
      - temporal
    command: python -m worker.worker

volumes:
  healthcare-data: